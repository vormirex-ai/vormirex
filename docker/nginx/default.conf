server {
    listen 80;

    # Use Docker's internal DNS so upstream hostnames are re-resolved
    # dynamically — prevents stale IP 502s after container restarts
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Vite HMR WebSocket — must be handled before the catch-all location
    location /@vite/client {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
